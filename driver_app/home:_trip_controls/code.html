<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0b73da",
              "background-light": "#f5f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex flex-col h-screen justify-between">
<div class="flex-grow">
<header class="flex items-center p-4">
<button class="p-2 text-gray-800 dark:text-gray-200">
<span class="material-symbols-outlined text-3xl">menu</span>
</button>
<h1 class="flex-1 text-center text-xl font-bold text-gray-900 dark:text-white pr-10">Home</h1>
</header>
<main class="px-4 py-6">
<div class="bg-background-light dark:bg-background-dark/50 rounded-xl p-4 shadow-md">
<h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Current Trip</h2>
<div class="flex items-center gap-4">
<div class="flex-shrink-0 bg-primary/20 dark:bg-primary/30 p-3 rounded-lg">
<span class="material-symbols-outlined text-primary text-3xl">route</span>
</div>
<div>
<p class="font-bold text-lg text-gray-900 dark:text-white">Morning Route</p>
<p class="text-gray-600 dark:text-gray-400">Route 123</p>
</div>
</div>
</div>
<div class="mt-8 space-y-4">
<button class="w-full bg-primary text-white font-bold py-5 rounded-xl text-lg tracking-wide shadow-lg">
              Start Trip
            </button>
<div class="grid grid-cols-2 gap-4">
<button class="w-full bg-primary/20 dark:bg-primary/30 text-primary font-bold py-5 rounded-xl text-lg tracking-wide">
                Delay
              </button>
<button class="w-full bg-primary/20 dark:bg-primary/30 text-primary font-bold py-5 rounded-xl text-lg tracking-wide">
                Report
              </button>
</div>
<button class="w-full bg-primary/20 dark:bg-primary/30 text-primary font-bold py-5 rounded-xl text-lg tracking-wide">
              Complete Trip
            </button>
</div>
</main>
</div>
<nav class="bg-white/90 dark:bg-background-dark/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800">
<div class="flex justify-around items-center h-20">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-xs font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">map</span>
<span class="text-xs font-medium">Route</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">pin_drop</span>
<span class="text-xs font-medium">Map</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-500 dark:text-gray-400" href="#">
<span class="material-symbols-outlined">description</span>
<span class="text-xs font-medium">Summary</span>
</a>
</div>
<div class="h-safe-area-bottom"></div>
</nav>
</div>

</body></html>
