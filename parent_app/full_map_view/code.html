<!DOCTYPE html>

        darkMode: "class",

          extend: {

              primary: "#1193d4",

</div>
</div>
</div>
</div>
</div>

</a>

<span class="material-symbols-outlined">event_busy</span>

<a class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400" href="#">
